<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>간단 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff5f8; --card: #ffffff; --text: #5a4a54; --muted: #b29aa8;
    --income: #3d8bd9; --expense: #ec5f86; --border: #ffe0ea; --accent: #ff8fb1;
    --accent-dark: #f0759c; --mint: #e3f6f1; --pink: #ffe8ef; --yellow: #fff6d6; --sky: #e6f2ff;
    --shadow: 0 4px 0 #ffd3e1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Jua", "Malgun Gothic", sans-serif;
    color: var(--text);
    background-color: var(--bg);
    background-image: radial-gradient(#ffd6e3 1.5px, transparent 1.5px);
    background-size: 22px 22px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 {
    font-size: 30px; margin: 0 0 4px; text-align: center; color: var(--accent-dark);
    letter-spacing: 1px; text-shadow: 2px 2px 0 #fff;
  }
  .cheer {
    display: block; width: fit-content; margin: 6px auto 8px; padding: 6px 18px;
    background: var(--yellow); color: var(--accent-dark); border: 2px dashed #ffcf5c;
    border-radius: 999px; font-size: 17px; animation: wiggle 2.4s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg) scale(1.04); }
  }
  @media (prefers-reduced-motion: reduce) { .cheer { animation: none; } }
  .subtitle { text-align: center; color: var(--muted); font-size: 15px; margin-bottom: 20px; }
  .card {
    background: var(--card); border-radius: 24px; padding: 20px;
    border: 2px solid var(--border); box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .month-bar { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .month-bar button {
    border: none; background: var(--pink); color: var(--accent-dark); font-size: 16px;
    width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-family: inherit;
    transition: transform .15s;
  }
  .month-bar button:hover { transform: scale(1.12); }
  .month-bar span { font-size: 22px; min-width: 140px; text-align: center; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; margin-top: 16px; }
  .summary > div { border-radius: 18px; padding: 12px 6px; }
  .summary > div:nth-child(1) { background: var(--sky); }
  .summary > div:nth-child(2) { background: var(--pink); }
  .summary > div:nth-child(3) { background: var(--yellow); }
  .summary .label { font-size: 14px; color: var(--text); opacity: .75; }
  .summary .value { font-size: 19px; margin-top: 4px; word-break: break-all; }
  .income { color: var(--income); }
  .expense { color: var(--expense); }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  form .full { grid-column: 1 / -1; }
  label { font-size: 14px; color: var(--muted); display: block; margin-bottom: 5px; padding-left: 4px; }
  input, select {
    width: 100%; padding: 11px 14px; border: 2px solid var(--border); border-radius: 14px;
    font-size: 15px; font-family: "Gowun Dodum", "Malgun Gothic", sans-serif; background: #fffafc;
    color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 4px #ffe3ec; }
  .type-toggle { display: flex; gap: 10px; }
  .type-toggle label {
    flex: 1; text-align: center; padding: 11px; border: 2px solid var(--border);
    border-radius: 999px; cursor: pointer; margin: 0; font-size: 16px; color: var(--muted);
    background: #fffafc; transition: all .15s;
  }
  .type-toggle input { display: none; }
  .type-toggle label:has(input[value="expense"]:checked) { background: var(--pink); border-color: var(--expense); color: var(--expense); }
  .type-toggle label:has(input[value="income"]:checked) { background: var(--sky); border-color: var(--income); color: var(--income); }
  .btn {
    padding: 14px; border: none; border-radius: 999px; background: var(--accent);
    color: #fff; font-size: 18px; cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 0 var(--accent-dark); transition: transform .1s, box-shadow .1s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dark); }
  .list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
  .list-head h2 { font-size: 19px; margin: 0; font-weight: normal; }
  .list-head select { width: auto; padding: 6px 12px; font-size: 14px; border-radius: 999px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 8px;
    border-radius: 18px; background: #fffafc; border: 2px dashed var(--border);
  }
  li:last-child { margin-bottom: 0; }
  .date { font-size: 13px; color: var(--muted); width: 38px; flex-shrink: 0; }
  .info { flex: 1; min-width: 0; }
  .cat { font-size: 12px; background: var(--mint); color: #3e9e84; padding: 2px 10px; border-radius: 999px; }
  .memo { margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: "Gowun Dodum", sans-serif; }
  .amt { white-space: nowrap; font-size: 16px; }
  .del {
    border: none; background: var(--pink); color: var(--accent-dark); cursor: pointer; font-size: 16px;
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; line-height: 1;
  }
  .del:hover { background: var(--accent); color: #fff; }
  li.empty, .empty { text-align: center; color: var(--muted); padding: 26px 0; display: block; border: none; background: none; }
  .cat-stats { margin-top: 6px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 10px 0; }
  .bar-row .name { width: 70px; flex-shrink: 0; }
  .bar-row .bar { flex: 1; height: 16px; background: var(--pink); border-radius: 999px; overflow: hidden; }
  .bar-row .fill {
    height: 100%; border-radius: 999px;
    background: repeating-linear-gradient(-45deg, #ff8fb1 0 8px, #ffa6c2 8px 16px);
  }
  .bar-row .num { width: 110px; text-align: right; flex-shrink: 0; }
  .tools { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .tools button {
    padding: 9px 16px; border: 2px solid var(--border); background: #fff; color: var(--text);
    border-radius: 999px; cursor: pointer; font-size: 14px; font-family: inherit;
  }
  .tools button:hover { background: var(--pink); }
  .icon {
    font-size: 20px; width: 40px; height: 40px; border-radius: 50%; background: var(--yellow);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  /* 달력 */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal .wd { text-align: center; font-size: 13px; color: var(--muted); padding: 4px 0; }
  .cal .wd:first-child, .cal .day.sun .num-d { color: var(--expense); }
  .cal .wd:last-child, .cal .day.sat .num-d { color: var(--income); }
  .cal .day {
    min-height: 76px; border: 2px solid #fff0f4; border-radius: 14px; padding: 5px;
    cursor: pointer; display: flex; flex-direction: column; gap: 2px; overflow: hidden;
    background: #fffafc; font-family: inherit; text-align: left; color: var(--text);
    transition: transform .12s, background .12s;
  }
  .cal .day:hover { background: var(--pink); transform: translateY(-2px); }
  .cal .day.blank { border: none; cursor: default; background: none; transform: none; }
  .cal .day.today { border-color: var(--accent); }
  .cal .day.today .num-d::after { content: " ⭐"; font-size: 10px; }
  .cal .day.selected { background: var(--yellow); border-color: #ffcf5c; }
  .cal .num-d { font-size: 13px; }
  .cal .ics { font-size: 13px; line-height: 1.15; white-space: nowrap; overflow: hidden; }
  .cal .d-amt { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: "Gowun Dodum", sans-serif; }
  .sel-info { font-size: 13px; color: var(--muted); }
  .sel-info button {
    margin-left: 6px; border: none; background: var(--pink); color: var(--accent-dark); border-radius: 999px;
    cursor: pointer; font-size: 12px; padding: 3px 10px; font-family: inherit;
  }
  @media (max-width: 480px) {
    h1 { font-size: 25px; }
    .card { padding: 16px; border-radius: 20px; }
    .cal { gap: 3px; }
    .cal .day { min-height: 58px; padding: 3px; border-radius: 10px; }
    .cal .ics { font-size: 11px; }
    .cal .d-amt { font-size: 8px; }
    form { grid-template-columns: 1fr; }
    .summary .value { font-size: 15px; }
    .bar-row .num { width: 90px; font-size: 13px; }
    .icon { width: 34px; height: 34px; font-size: 17px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐷 꿀꿀 가계부 🐷</h1>
  <div class="cheer">💪 바이브코딩 화이팅! 💪</div>
  <div class="subtitle">오늘도 차곡차곡 모아봐요 🍀</div>

  <!-- 월 선택 + 요약 -->
  <div class="card">
    <div class="month-bar">
      <button id="prevMonth" aria-label="이전 달">◀</button>
      <span id="monthLabel"></span>
      <button id="nextMonth" aria-label="다음 달">▶</button>
    </div>
    <div class="summary">
      <div><div class="label">💙 수입</div><div class="value income" id="sumIncome">0원</div></div>
      <div><div class="label">💗 지출</div><div class="value expense" id="sumExpense">0원</div></div>
      <div><div class="label">💛 잔액</div><div class="value" id="sumBalance">0원</div></div>
    </div>
  </div>

  <!-- 달력 -->
  <div class="card">
    <div class="list-head">
      <h2>📅 달력</h2>
      <span class="sel-info">날짜를 누르면 그날 내역만 보여요</span>
    </div>
    <div class="cal" id="calendar"></div>
  </div>

  <!-- 입력 폼 -->
  <div class="card">
    <form id="form">
      <div class="full type-toggle">
        <label><input type="radio" name="type" value="expense" checked><span>지출</span></label>
        <label><input type="radio" name="type" value="income"><span>수입</span></label>
      </div>
      <div>
        <label for="date">날짜</label>
        <input type="date" id="date" required>
      </div>
      <div>
        <label for="category">분류</label>
        <select id="category"></select>
      </div>
      <div>
        <label for="amount">금액</label>
        <input type="text" id="amount" inputmode="numeric" placeholder="0" required>
      </div>
      <div>
        <label for="memo">메모</label>
        <input type="text" id="memo" placeholder="예: 점심 김밥" maxlength="50">
      </div>
      <button type="submit" class="btn full">추가하기 ✨</button>
    </form>
  </div>

  <!-- 내역 -->
  <div class="card">
    <div class="list-head">
      <h2>📝 내역 <span class="sel-info" id="selInfo"></span></h2>
      <select id="filter">
        <option value="all">전체</option>
        <option value="income">수입</option>
        <option value="expense">지출</option>
      </select>
    </div>
    <ul id="list"></ul>
  </div>

  <!-- 분류별 지출 -->
  <div class="card">
    <div class="list-head"><h2>🍩 분류별 지출</h2></div>
    <div class="cat-stats" id="catStats"></div>
  </div>

  <div class="tools">
    <button id="exportBtn">📤 CSV 내보내기</button>
    <button id="resetBtn">🗑️ 전체 삭제</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // Supabase 연결 정보 (publishable 키는 브라우저에 공개해도 되는 키예요)
  const SUPABASE_URL = 'https://wkdhpcyuuhnpoqdzhefp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_vKxklHaM1ZLVIuuiis4XAA_zAHESlGL';
  const TABLE = 'ledger_entries';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const STORAGE_KEY = 'simple-ledger-v1'; // 예전 localStorage 데이터 옮기기용
  const CATEGORIES = {
    expense: ['식비', '교통', '쇼핑', '주거', '통신', '의료', '문화', '기타'],
    income: ['월급', '용돈', '부수입', '기타']
  };
  const ICONS = {
    expense: { '식비': '🍚', '교통': '🚌', '쇼핑': '🛍️', '주거': '🏠', '통신': '📱', '의료': '💊', '문화': '🎬', '기타': '📦' },
    income: { '월급': '💼', '용돈': '🎁', '부수입': '💵', '기타': '💰' }
  };
  const iconOf = (type, cat) => (ICONS[type] && ICONS[type][cat]) || (type === 'income' ? '💰' : '📦');
  let selectedDay = null; // 'YYYY-MM-DD' 또는 null

  // 데이터는 Supabase의 ledger_entries 테이블에 저장됩니다
  let items = [];
  let current = new Date();
  current.setDate(1);

  const $ = (id) => document.getElementById(id);
  const won = (n) => n.toLocaleString('ko-KR') + '원';
  const pad = (n) => String(n).padStart(2, '0');
  const ym = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;

  function showError(msg, error) {
    console.error(msg, error);
    alert(`${msg} 😢\n${error?.message || ''}`);
  }

  async function load() {
    const { data, error } = await db.from(TABLE)
      .select('id, type, date, category, amount, memo')
      .order('date', { ascending: false });
    if (error) { showError('내역을 불러오지 못했어요', error); return; }
    items = data.map(r => ({ ...r, amount: Number(r.amount) }));
    render();
  }

  // 예전에 브라우저(localStorage)에 저장해 둔 내역이 있으면 DB로 옮겨줌
  async function migrateLocal() {
    let old = [];
    try { old = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return; }
    if (!old.length) return;
    if (!confirm(`이 브라우저에 예전 내역 ${old.length}건이 있어요. DB로 옮길까요?`)) return;
    const rows = old.map(({ type, date, category, amount, memo }) =>
      ({ type, date, category, amount, memo: memo || '' }));
    const { error } = await db.from(TABLE).insert(rows);
    if (error) { showError('예전 내역을 옮기지 못했어요', error); return; }
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
  }

  function getType() {
    return document.querySelector('input[name="type"]:checked').value;
  }

  function fillCategories() {
    const t = getType();
    $('category').innerHTML = CATEGORIES[t]
      .map(c => `<option value="${c}">${iconOf(t, c)} ${c}</option>`).join('');
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  function render() {
    const month = ym(current);
    $('monthLabel').textContent = `${current.getFullYear()}년 ${current.getMonth() + 1}월`;

    const monthItems = items
      .filter(it => it.date.startsWith(month))
      .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);

    const inc = monthItems.filter(i => i.type === 'income').reduce((s, i) => s + i.amount, 0);
    const exp = monthItems.filter(i => i.type === 'expense').reduce((s, i) => s + i.amount, 0);
    $('sumIncome').textContent = won(inc);
    $('sumExpense').textContent = won(exp);
    const bal = inc - exp;
    $('sumBalance').textContent = won(bal);
    $('sumBalance').className = 'value ' + (bal < 0 ? 'expense' : bal > 0 ? 'income' : '');

    renderCalendar(monthItems);

    // 내역 목록
    if (selectedDay && !selectedDay.startsWith(month)) selectedDay = null;
    $('selInfo').innerHTML = selectedDay
      ? `· ${Number(selectedDay.slice(8))}일 <button id="clearDay">전체 보기</button>` : '';
    const filter = $('filter').value;
    const shown = monthItems.filter(i =>
      (filter === 'all' || i.type === filter) && (!selectedDay || i.date === selectedDay));
    $('list').innerHTML = shown.length ? shown.map(i => `
      <li>
        <div class="icon">${iconOf(i.type, i.category)}</div>
        <div class="date">${Number(i.date.slice(8))}일</div>
        <div class="info">
          <span class="cat">${escapeHtml(i.category)}</span>
          <div class="memo">${escapeHtml(i.memo || '-')}</div>
        </div>
        <div class="amt ${i.type}">${i.type === 'income' ? '+' : '-'}${won(i.amount)}</div>
        <button class="del" data-id="${i.id}" title="삭제">×</button>
      </li>`).join('') : '<li class="empty">아직 내역이 없어요 🐣</li>';

    // 분류별 지출
    const byCat = {};
    monthItems.filter(i => i.type === 'expense')
      .forEach(i => byCat[i.category] = (byCat[i.category] || 0) + i.amount);
    const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    $('catStats').innerHTML = cats.length ? cats.map(([name, sum]) => `
      <div class="bar-row">
        <div class="name">${iconOf('expense', name)} ${escapeHtml(name)}</div>
        <div class="bar"><div class="fill" style="width:${(sum / exp * 100).toFixed(1)}%"></div></div>
        <div class="num">${won(sum)}</div>
      </div>`).join('') : '<div class="empty">이번 달은 지출이 없어요! 최고 👍</div>';
  }

  function renderCalendar(monthItems) {
    const y = current.getFullYear(), m = current.getMonth();
    const firstDow = new Date(y, m, 1).getDay();
    const lastDate = new Date(y, m + 1, 0).getDate();
    const now = new Date();
    const todayStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

    // 날짜별 묶기
    const byDay = {};
    monthItems.forEach(i => (byDay[i.date] = byDay[i.date] || []).push(i));

    let html = ['일', '월', '화', '수', '목', '금', '토'].map(w => `<div class="wd">${w}</div>`).join('');
    for (let i = 0; i < firstDow; i++) html += '<div class="day blank"></div>';
    for (let d = 1; d <= lastDate; d++) {
      const key = `${y}-${pad(m + 1)}-${pad(d)}`;
      const list = byDay[key] || [];
      const inc = list.filter(i => i.type === 'income').reduce((s, i) => s + i.amount, 0);
      const exp = list.filter(i => i.type === 'expense').reduce((s, i) => s + i.amount, 0);
      const icons = [...new Set(list.map(i => iconOf(i.type, i.category)))];
      const dow = (firstDow + d - 1) % 7;
      const cls = ['day', dow === 0 ? 'sun' : '', dow === 6 ? 'sat' : '',
        key === todayStr ? 'today' : '', key === selectedDay ? 'selected' : ''].join(' ');
      html += `<button type="button" class="${cls}" data-day="${key}">
        <span class="num-d">${d}</span>
        <span class="ics" title="${list.map(i => i.category).join(', ')}">${icons.slice(0, 3).join('')}${icons.length > 3 ? '…' : ''}</span>
        ${inc ? `<span class="d-amt income">+${inc.toLocaleString('ko-KR')}</span>` : ''}
        ${exp ? `<span class="d-amt expense">-${exp.toLocaleString('ko-KR')}</span>` : ''}
      </button>`;
    }
    $('calendar').innerHTML = html;
  }

  $('calendar').addEventListener('click', (e) => {
    const cell = e.target.closest('.day[data-day]');
    if (!cell) return;
    const key = cell.dataset.day;
    selectedDay = selectedDay === key ? null : key;
    if (selectedDay) $('date').value = selectedDay; // 입력 날짜도 맞춰줌
    render();
  });

  $('selInfo').addEventListener('click', (e) => {
    if (e.target.id === 'clearDay') { selectedDay = null; render(); }
  });

  // 금액 입력 시 자동 콤마
  $('amount').addEventListener('input', (e) => {
    const digits = e.target.value.replace(/[^\d]/g, '');
    e.target.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
  });

  document.querySelectorAll('input[name="type"]').forEach(r =>
    r.addEventListener('change', fillCategories));

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const amount = Number($('amount').value.replace(/[^\d]/g, ''));
    if (!amount) { alert('금액을 입력하세요'); return; }
    const submitBtn = e.target.querySelector('.btn');
    submitBtn.disabled = true;
    const { error } = await db.from(TABLE).insert({
      type: getType(),
      date: $('date').value,
      category: $('category').value,
      amount,
      memo: $('memo').value.trim()
    });
    submitBtn.disabled = false;
    if (error) { showError('저장하지 못했어요', error); return; }
    // 입력한 날짜의 달로 이동
    const [y, m] = $('date').value.split('-').map(Number);
    current = new Date(y, m - 1, 1);
    $('amount').value = '';
    $('memo').value = '';
    $('amount').focus();
    await load();
  });

  $('list').addEventListener('click', async (e) => {
    const btn = e.target.closest('.del');
    if (!btn) return;
    if (!confirm('이 내역을 삭제할까요?')) return;
    const { error } = await db.from(TABLE).delete().eq('id', Number(btn.dataset.id));
    if (error) { showError('삭제하지 못했어요', error); return; }
    await load();
  });

  $('filter').addEventListener('change', render);
  $('prevMonth').addEventListener('click', () => { current.setMonth(current.getMonth() - 1); render(); });
  $('nextMonth').addEventListener('click', () => { current.setMonth(current.getMonth() + 1); render(); });

  $('exportBtn').addEventListener('click', () => {
    const rows = [['날짜', '구분', '분류', '금액', '메모']].concat(
      [...items].sort((a, b) => a.date.localeCompare(b.date)).map(i =>
        [i.date, i.type === 'income' ? '수입' : '지출', i.category, i.amount, i.memo]));
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `가계부_${ym(new Date())}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $('resetBtn').addEventListener('click', async () => {
    if (!confirm('DB에 있는 모든 내역을 삭제합니다. 되돌릴 수 없습니다. 계속할까요?')) return;
    const { error } = await db.from(TABLE).delete().gt('id', 0);
    if (error) { showError('삭제하지 못했어요', error); return; }
    await load();
  });

  // 초기화
  const today = new Date();
  $('date').value = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
  fillCategories();
  render();
  migrateLocal().then(load);
</script>
</body>
</html>
